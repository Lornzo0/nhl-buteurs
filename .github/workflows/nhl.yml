name: NHL — prédictions et résultats

on:
  schedule:
    - cron: "30 7 * * *"   # 8h30 Paris : résultats de la nuit
    - cron: "0 8 * * *"    # 9h Paris   : avant-première
    - cron: "0 17 * * *"   # 18h Paris  : mise à jour (blessures, gardiens)
    - cron: "0 23 * * *"   # minuit     : version finale archivée
    - cron: "0 5 * * 1"    # lundi 6h   : ré-entraînement du modèle
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche à lancer"
        type: choice
        options: [update, preview, final, results, train]
        default: update

permissions:
  contents: write

concurrency:
  group: nhl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache des données MoneyPuck
        uses: actions/cache@v4
        with:
          path: .cache
          key: mp-${{ github.run_id }}
          restore-keys: mp-
      - name: Choisir la tâche
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * *") T=results ;;
            "0 8 * * *")  T=preview ;;
            "0 17 * * *") T=update ;;
            "0 23 * * *") T=final ;;
            "0 5 * * 1")  T=train ;;
            *)            T="${{ inputs.task }}" ;;
          esac
          if [ ! -f models/features.json ] && [ "$T" != "train" ]; then T="train_then_$T"; fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
      - name: Lancer
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          T="${{ steps.t.outputs.task }}"
          case "$T" in train_then_*) python -m nhl.train; T="${T#train_then_}" ;; esac
          case "$T" in
            train)   python -m nhl.train ;;
            results) python -m nhl.results ;;
            *)       python -m nhl.predict --stage "$T" ;;
          esac
      - name: Publier
        run: |
          git config user.name "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          git add docs models history
          git diff --cached --quiet || git commit -m "NHL ${{ steps.t.outputs.task }} $(date -u +%F)"
          git pull --rebase && git push
