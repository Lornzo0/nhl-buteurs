name: NBA — prédictions 20+ et résultats

on:
  schedule:
    # Même principe que la NHL : un passage par heure, le script décide quoi faire.
    # Minute différente de la NHL pour que les deux tâches ne publient pas en même temps.
    - cron: "47 * * * *"   # résultats + avant-première / mise à jour / finale
    - cron: "11 6 * * 1"   # lundi : ré-entraînement du modèle
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche à lancer"
        type: choice
        options: [auto, update, preview, final, results, train]
        default: auto

permissions:
  contents: write

concurrency:
  group: nba
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache des feuilles de match NBA
        uses: actions/cache@v4
        with:
          path: .cache/nba
          key: nba-${{ github.run_id }}
          restore-keys: nba-
      - name: Choisir la tâche
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "47 * * * *") T=auto ;;
            "11 6 * * 1") T=train ;;
            *)            T="${{ inputs.task }}" ;;
          esac
          if [ ! -f models/nba/features.json ] && [ "$T" != "train" ]; then T="train_then_$T"; fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
      - name: Lancer
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          T="${{ steps.t.outputs.task }}"
          case "$T" in train_then_*) python -m nba.train; T="${T#train_then_}" ;; esac
          case "$T" in
            train)   python -m nba.train ;;
            results) python -m nba.results ;;
            auto)    python -m nba.results && python -m nba.predict --stage auto ;;
            *)       python -m nba.predict --stage "$T" ;;
          esac
      - name: Publier
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add docs/nba models/nba history/nba
          git diff --cached --quiet || git commit -m "NBA ${{ steps.t.outputs.task }} $(date -u +%F)"
          git pull --rebase && git push
